name: Cron Jobs

on:
  schedule:
    - cron: '0 5 * * *'      # 05:00 UTC — competitor scan
    - cron: '30 5 * * *'     # 05:30 UTC — digest
    - cron: '0 */6 * * *'    # every 6 hours — CTR check
    - cron: '30 4 * * *'     # 04:30 UTC — outlier scan
  workflow_dispatch:

jobs:
  competitor-scan:
    if: github.event.schedule == '0 5 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger competitor scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -v -X POST "https://thumbrankpro.com/api/cron/dispatch" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -d '{"job":"competitor-scan"}'

  digest:
    if: github.event.schedule == '30 5 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -v -X POST "https://thumbrankpro.com/api/cron/dispatch" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -d '{"job":"digest"}'

  ctr-check:
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CTR check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -v -X POST "https://thumbrankpro.com/api/cron/dispatch" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -d '{"job":"ctr-check"}'

  outlier-scan:
    if: github.event.schedule == '30 4 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger outlier scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -v -X POST "https://thumbrankpro.com/api/cron/dispatch" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -d '{"job":"outlier-scan"}'

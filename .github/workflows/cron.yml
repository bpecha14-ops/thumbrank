name: Cron Jobs

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '30 5 * * *'
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  competitor-scan:
    if: github.event.schedule == '0 5 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger competitor scan
        run: |
          curl -X POST "$APP_URL/api/cron/dispatch" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{"job":"competitor-scan"}'

  digest:
    if: github.event.schedule == '30 5 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger digest
        run: |
          curl -X POST "$APP_URL/api/cron/dispatch" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{"job":"digest"}'

  ctr-check:
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger CTR check
        run: |
          curl -X POST "$APP_URL/api/cron/dispatch" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{"job":"ctr-check"}'
